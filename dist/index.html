    more: "Two hearts pump blood through the gills and the third pumps it to the rest of the body. Their blood is blue because it carries oxygen with a copper-based protein called hemocyanin.",
    kids: true, kid: "An octopus has three hearts, and its blood is blue!", src: "Smithsonian Ocean" },
  { id: 'l002', type: 'quiz', cat: 'space', emoji: "🌕", q: "How long does light from the Moon take to reach Earth?",
    options: ["About 1 second", "About 8 minutes", "About 1 hour", "About 1 day"], answer: 0,
    explain: "The Moon is about 384,000 km away, so its light reaches us in about 1.3 seconds.",
    kids: false, src: "NASA" },
  { id: 'l003', type: 'myth', cat: 'animals', emoji: "🐠", myth: "Goldfish only remember things for three seconds.",
    truth: "Goldfish can remember things for months. Researchers have trained them to respond to sounds and to push levers for food.",
    kids: true, kid: "Goldfish can remember things for months, not seconds!", src: "University research, summarized by BBC Science Focus" },
  { id: 'l004', type: 'fact', cat: 'body', emoji: "👶", title: "Babies have extra bones",
    fact: "A newborn baby has roughly 275 to 300 bones, but most adults have 206.",
    more: "Many of a baby's bones start out as separate pieces, partly made of soft cartilage. As children grow, some of them fuse together, like the plates of the skull, until the count settles at 206.",
    kids: true, kid: "Babies have more bones than grown-ups! Some of them join together as you grow.", src: "Cleveland Clinic" },
  { id: 'l005', type: 'fact', cat: 'space', emoji: "⏳", title: "A day longer than a year",
    fact: "Venus takes longer to spin around once than it takes to travel all the way around the Sun.",
    more: "Venus needs about 243 Earth days to turn once on its axis, but only about 225 days to orbit the Sun. It also spins backward compared with most planets, so the Sun rises in the west there.",
    kids: true, kid: "Venus spins so slowly that one spin takes longer than its whole trip around the Sun!", src: "NASA" },
  { id: 'l006', type: 'fact', cat: 'earth', emoji: "⚡", title: "Hotter than the Sun",
    fact: "Lightning can heat the air around it to about 28,000°C, several times hotter than the surface of the Sun.",
    more: "That sudden blast of heat makes the air expand faster than the speed of sound, creating a shock wave. The sound of that shock wave is thunder.",
    kids: true, kid: "Lightning is hotter than the outside of the Sun! Its heat makes the boom we call thunder.", src: "NOAA National Weather Service" },
  { id: 'l007', type: 'quiz', cat: 'body', emoji: "👂", q: "Where is the smallest bone in your body?",
    options: ["In your toe", "In your nose", "In your finger", "In your ear"], answer: 3,
    explain: "The stapes, deep inside your ear, is only about 3 mm long. It helps pass sound vibrations to your inner ear.",
    kids: true, src: "Britannica" },
  { id: 'l008', type: 'fact', cat: 'earth', emoji: "⛅", title: "Heavy, fluffy clouds",
    fact: "A typical fluffy cumulus cloud holds about 500 tonnes of water, roughly the weight of 100 elephants.",
    more: "That water is spread out as countless droplets so tiny they barely fall. The drier air below the cloud is heavier still, so the cloud floats on it. The estimate is for a cloud about 1 kilometer across.",
    kids: true, kid: "A puffy cloud can weigh as much as 100 elephants!", src: "USGS Water Science School" },
  { id: 'l009', type: 'fact', cat: 'space', emoji: "👣", title: "Moonwalk trails are still there",
    fact: "The trails Apollo astronauts walked on the Moon are still visible from orbit, more than 50 years later.",
    more: "The Moon has no wind or rain to wipe the ground clean. In 2011, NASA's Lunar Reconnaissance Orbiter photographed the astronauts' paths and rover tracks at three landing sites. Only very slow wear from tiny space rocks will blur them over time.",
    kids: true, kid: "Astronaut footprints are still on the Moon, because there is no wind to blow them away!", src: "NASA Lunar Reconnaissance Orbiter" },
  { id: 'l010', type: 'fact', cat: 'ocean', emoji: "🌊", title: "Thank the ocean for air",
    fact: "About half of the oxygen produced on Earth comes from the ocean, mostly from tiny drifting life called phytoplankton.",
    more: "Phytoplankton use sunlight to make their food, just like plants on land, and give off oxygen as they do it. Each one is too small to see, but there are so many that together they rival all the forests on land.",
    kids: true, kid: "Tiny living things in the ocean make about half of the oxygen made on Earth!", src: "NOAA" },
  { id: 'l011', type: 'myth', cat: 'animals', emoji: "🦇", myth: "Bats are blind.",
    truth: "All bats can see, and some see quite well. Many bats also use echolocation, sending out calls and listening for the echoes, to find insects in the dark.",
    kids: true, kid: "Bats are not blind! They can see, and many also find food by listening to echoes.", src: "National Park Service" },
  { id: 'l012', type: 'fact', cat: 'earth', emoji: "🌋", title: "A Sun-hot center",
    fact: "Earth's inner core is roughly as hot as the surface of the Sun, around 5,000 to 6,000°C.",
    more: "The inner core is a ball of mostly iron and nickel about 2,400 km wide. It stays solid even at that temperature because the pressure at the center of Earth is more than 3 million times the pressure at the surface.",
    kids: true, kid: "The center of Earth is about as hot as the outside of the Sun!", src: "Science (Anzellini et al., 2013); USGS" },
  { id: 'l013', type: 'fact', cat: 'ocean', emoji: "🐋", title: "Biggest animal ever",
    fact: "The blue whale is the largest animal known to have ever lived.",
    more: "Blue whales can grow to about 30 meters (nearly 100 feet) long, and the biggest weigh well over 100 tons. Amazingly, they eat mostly krill, shrimp-like animals only a few centimeters long.",
    kids: true, kid: "The blue whale is the biggest animal ever, even bigger than the biggest dinosaurs!", src: "NOAA Fisheries" },
  { id: 'l014', type: 'quiz', cat: 'sports', emoji: "⚾", q: "How many double stitches hold an official Major League baseball together?",
    options: ["56", "108", "212", "360"], answer: 1,
    explain: "108 double stitches of red waxed thread, which makes 216 single stitches in all.",
    kids: true, src: "Major League Baseball; Rawlings" },
  { id: 'l015', type: 'fact', cat: 'space', emoji: "🌞", title: "Eight-minute-old sunshine",
    fact: "The sunlight hitting you right now left the Sun about 8 minutes ago.",
    more: "Light is the fastest thing there is, covering about 300,000 km every second. The Sun is about 150 million km away, so its light needs roughly 8 minutes and 20 seconds to reach Earth.",
    kids: true, kid: "Sunlight takes about 8 minutes to travel from the Sun to you!", src: "NASA" },
  { id: 'l016', type: 'fact', cat: 'how', emoji: "🎈", title: "Puffy snack bags",
    fact: "Sealed snack bags puff up on a plane because the cabin air pressure is lower than at sea level.",
    more: "Airliner cabins are pressurized, but only to about what you would feel 1,800 to 2,400 meters (6,000 to 8,000 feet) up a mountain. The bag was sealed at ground-level pressure, so the air inside pushes outward.",
    kids: true, kid: "Snack bags puff up on planes because the air pressure inside the plane is lower!", src: "FAA (14 CFR 25.841)" },
  { id: 'l017', type: 'quiz', cat: 'body', emoji: "🦴", q: "How many bones does a typical adult have?",
    options: ["106", "206", "306", "406"], answer: 1,
    explain: "Most adults have 206 bones. More than half of them are in your hands and feet!",
    kids: true, src: "Cleveland Clinic" },
  { id: 'l018', type: 'fact', cat: 'math', emoji: "🃏", title: "A brand-new shuffle",
    fact: "A well-shuffled deck of cards is almost certainly in an order no one has ever seen before.",
    more: "There are 52 factorial ways to arrange 52 cards, about 8 followed by 67 zeros. Even if every person on Earth had shuffled a deck every second since the universe began, they would not come close to trying them all.",
    kids: true, kid: "When you shuffle cards well, you probably make an order nobody has ever made before!", src: "Combinatorics (52 factorial)" },
  { id: 'l019', type: 'fact', cat: 'animals', emoji: "🟫", title: "Cube-shaped poop",
    fact: "Wombats are the only animals known to make cube-shaped poop.",
    more: "Scientists found that the end of a wombat's intestine has stiff and stretchy sections that shape the droppings into blocks. Wombats leave them on rocks and logs to mark their territory, and the flat sides may help them stay put.",
    kids: true, kid: "Wombats make poop shaped like little cubes!", src: "Georgia Tech research (Yang et al.)" },
  { id: 'l020', type: 'myth', cat: 'food', emoji: "🧂", myth: "Adding salt to water makes it boil faster.",
    truth: "Salt actually raises the boiling point a tiny bit, and with the amount used for cooking, the time difference is just seconds, if any. Salt can make bubbles appear, but that is not boiling.",
    kids: true, kid: "Salt does not make water boil faster. It just adds flavor!", src: "Live Science" },
  { id: 'l021', type: 'fact', cat: 'how', emoji: "🥛", title: "Fridges move heat",
    fact: "A refrigerator doesn't make cold. It pumps heat out of the inside and dumps it into your kitchen.",
    more: "A special fluid soaks up heat as it turns into a gas inside the fridge. A compressor squeezes that gas, and coils on the back or bottom release the heat into the room. That's why those coils feel warm.",
    kids: true, kid: "A fridge works by moving heat out, which is why the back of it feels warm!", src: "Penn State University (EGEE 102)" },
  { id: 'l022', type: 'fact', cat: 'space', emoji: "⭐", title: "The heaviest sugar cube",
    fact: "A sugar-cube-sized piece of a neutron star would weigh about a billion tons on Earth.",
    more: "A neutron star is the collapsed core of a giant star that exploded. It usually packs more mass than our Sun into a ball about the size of a city, so its matter is squeezed together incredibly tightly.",
    kids: true, kid: "A piece of a neutron star the size of a sugar cube would weigh about a billion tons!", src: "NASA Chandra X-ray Observatory" },
  { id: 'l023', type: 'quiz', cat: 'ocean', emoji: "🌎", q: "About how much of Earth's surface is covered by ocean?",
    options: ["About 25 percent", "About 50 percent", "About 70 percent", "About 90 percent"], answer: 2,
    explain: "About 71 percent. The ocean also holds about 96.5 percent of all the water on Earth.",
    kids: false, src: "USGS" },
  { id: 'l024', type: 'fact', cat: 'math', emoji: "🐝", title: "Bees picked the best shape",
    fact: "Hexagons split a flat surface into equal cells using the least total wall, as mathematician Thomas Hales proved in 1999.",
    more: "People suspected this for about 2,000 years, and it was called the honeycomb conjecture. For bees, shorter walls mean less wax, which helps explain why honeycomb cells are six-sided.",
    kids: true, kid: "Six-sided cells let bees build their honeycomb using less wax!", src: "Hales, Discrete & Computational Geometry (2001)" },
  { id: 'l025', type: 'fact', cat: 'body', emoji: "💓", title: "A hard-working heart",
    fact: "Your heart beats about 100,000 times a day.",
    more: "A resting adult heart usually beats 60 to 100 times a minute. At around 70 beats a minute, that adds up to about 100,000 beats a day and more than 35 million in a year.",
    kids: true, kid: "Your heart beats about 100,000 times every day!", src: "American Heart Association" },
  { id: 'l026', type: 'myth', cat: 'earth', emoji: "🏢", myth: "Lightning never strikes the same place twice.",
    truth: "Lightning often hits the same spot again and again, especially tall, pointy objects. The Empire State Building in New York is struck about 20 to 25 times a year.",
    kids: true, kid: "Lightning can strike the same place many times. A tall New York building gets hit about 20 times a year!", src: "NOAA National Weather Service" },
  { id: 'l027', type: 'fact', cat: 'animals', emoji: "🦉", title: "Owls turn heads, not eyes",
    fact: "Owls can turn their heads about 270 degrees, three-quarters of the way around.",
    more: "Their big eyes are fixed in place, so owls swivel their heads instead. Johns Hopkins researchers found special features in owl necks, including blood vessels that can balloon out, that keep blood flowing to the brain while they twist.",
    kids: true, kid: "Owls can't move their eyes, so they turn their heads almost all the way around!", src: "Johns Hopkins Medicine (Science, 2013)" },
  { id: 'l028', type: 'fact', cat: 'food', emoji: "🍯", title: "Honey barely spoils",
    fact: "Sealed honey can last for decades or longer without spoiling.",
    more: "Honey has very little free water, so germs that land in it get dried out. It is also acidic, and bees add an enzyme that makes a little hydrogen peroxide. Over many years it may crystallize or lose flavor, but it rarely goes bad.",
    kids: true, kid: "Honey can stay good for years and years!", src: "Smithsonian Magazine" },
  { id: 'l029', type: 'quiz', cat: 'inventions', emoji: "🧸", q: "Before it was a toy, what was Play-Doh sold as?",
    options: ["Wallpaper cleaner", "Bread dough", "Window putty", "Shoe polish"], answer: 0,
    explain: "It was a putty for wiping soot off wallpaper. When homes stopped heating with coal, a teacher tried it as modeling clay, and it became a toy in 1956.",
    kids: true, src: "Smithsonian Magazine" },
  { id: 'l030', type: 'fact', cat: 'art', emoji: "💎", title: "A blue worth more than gold",
    fact: "The finest ultramarine blue paint was once even more precious than gold.",
    more: "It was made by grinding up lapis lazuli, a stone mined mainly in the mountains of Afghanistan, and purifying it took a lot of work. Painters often saved it for the most important parts of a picture.",
    kids: true, kid: "One special blue paint used to cost more than gold!", src: "National Gallery, London" },
  { id: 'l031', type: 'fact', cat: 'sports', emoji: "⛳", title: "Dimples make it fly",
    fact: "The dimples on a golf ball help it fly much farther than a smooth ball would.",
    more: "Dimples stir up a thin layer of air that clings to the ball longer, shrinking the low-pressure wake behind it. That can cut drag by up to about half. With backspin, the dimples also help create lift that keeps the ball in the air.",
    kids: true, kid: "The little dents on a golf ball help it fly farther!", src: "Choi et al., Physics of Fluids (2006); University of Illinois Physics" },
  { id: 'l032', type: 'quiz', cat: 'space', emoji: "🔥", q: "Which planet is the hottest in our solar system?",
    options: ["Mercury", "Venus", "Mars", "Jupiter"], answer: 1,
    explain: "Venus is the hottest, even though Mercury is closer to the Sun. Its thick blanket of carbon dioxide traps heat, keeping the surface above 450°C, hot enough to melt lead.",
    kids: true, src: "NASA" },
  { id: 'l033', type: 'fact', cat: 'ocean', emoji: "🦦", title: "The world's thickest fur",
    fact: "Sea otters have the densest fur of any animal, up to about a million hairs per square inch.",
    more: "Unlike whales and seals, sea otters have no thick layer of blubber. Instead, their fur traps a layer of air that keeps cold water away from their skin, so they spend lots of time grooming to keep it fluffy.",
    kids: true, kid: "Sea otters have the thickest fur of any animal, and it keeps them warm in cold water!", src: "Guinness World Records; Seattle Aquarium" },
  { id: 'l034', type: 'fact', cat: 'inventions', emoji: "🐕", title: "Burrs on a dog",
    fact: "Velcro was inspired by prickly burrs that clung to an inventor's dog and pants after an outing in the Alps.",
    more: "In 1941, Swiss engineer George de Mestral looked at the burrs under a microscope and saw thousands of tiny hooks grabbing loops of fabric and fur. It took him years to copy the idea, and the name comes from the French words velours (velvet) and crochet (hook).",
    kids: true, kid: "Velcro was invented after an inventor saw prickly seeds stuck to his dog's fur!", src: "Velcro Companies; WIPO" },
  { id: 'l035', type: 'myth', cat: 'art', emoji: "🎶", myth: "Listening to Mozart makes you smarter.",
    truth: "A small 1993 study found a brief boost on one kind of puzzle task that lasted only minutes. Later reviews of many studies found little or no real effect, and any music people enjoy can give a similar short lift.",
    kids: false, src: "Pietschnig et al., Intelligence (2010); Chabris, Nature (1999)" },
  { id: 'l036', type: 'fact', cat: 'math', emoji: "🔢", title: "A 9-year-old named it",
    fact: "The number googol, a 1 followed by 100 zeros, was named by a 9-year-old boy.",
    more: "Mathematician Edward Kasner asked his young nephew, Milton Sirotta, to make up a name for this huge number. Years later, the founders of Google named their company with a play on the word.",
    kids: true, kid: "A 9-year-old boy named the giant number googol: a 1 with 100 zeros after it!", src: "Merriam-Webster" },
  { id: 'l037', type: 'fact', cat: 'body', emoji: "⏰", title: "Taller in the morning",
    fact: "Most people are about 1 to 2 centimeters taller when they wake up than at bedtime.",
    more: "During the day, gravity slowly squeezes water out of the soft discs between the bones of your spine. Lying down at night lets them soak it back up. Most of the shrinking happens in the first hour after you get up.",
    kids: true, kid: "You are a tiny bit taller in the morning than at bedtime!", src: "Spine journal (1985 study of daily height change)" },
  { id: 'l038', type: 'quiz', cat: 'sports', emoji: "⛳", q: "About how many dimples does a typical golf ball have?",
    options: ["About 50", "About 100", "300 to 500", "Over 2,000"], answer: 2,
    explain: "Most golf balls have between 300 and 500 dimples, depending on the brand and model. The rules don't set a number, but the pattern must be symmetrical.",
    kids: true, src: "Golf Monthly; Rules of Golf" },
  { id: 'l039', type: 'fact', cat: 'how', emoji: "📡", title: "Einstein in your phone",
    fact: "GPS only works because engineers correct the satellites' clocks for Einstein's theories of relativity.",
    more: "Moving fast makes the satellite clocks run slightly slow, while weaker gravity up high makes them run fast. Together they gain about 38 millionths of a second a day, which would throw off positions if it were not corrected.",
    kids: false, src: "Ashby, Living Reviews in Relativity (2003)" },
  { id: 'l040', type: 'fact', cat: 'words', emoji: "🤖", title: "Robots came from a play",
    fact: "The word \"robot\" was first used in a 1920 Czech play, from an old word for forced labor.",
    more: "Writer Karel Čapek used it for the artificial workers in his play R.U.R. (Rossum's Universal Robots). He said his brother Josef suggested the word, based on the Czech robota, meaning hard, forced work.",
    kids: true, kid: "The word robot comes from a play written in 1920!", src: "Science Friday; BBC Science Focus" },
  { id: 'l041', type: 'myth', cat: 'earth', emoji: "☔", myth: "Raindrops are shaped like teardrops.",
    truth: "Small raindrops are round like tiny balls, and bigger ones get flattened by the air as they fall, so they look more like the top of a hamburger bun. The teardrop shape is just how drops look sliding down a window.",
    kids: true, kid: "Raindrops are not teardrop-shaped! Small ones are round and big ones look like hamburger buns.", src: "USGS Water Science School" },
  { id: 'l042', type: 'fact', cat: 'animals', emoji: "🦋", title: "Tasting with their feet",
    fact: "Butterflies taste with their feet.",
    more: "They have taste sensors on their feet. When a female lands on a leaf, she can tell whether it is the right kind of plant for her caterpillars to eat before she lays her eggs there.",
    kids: true, kid: "Butterflies taste things with their feet!", src: "Carleton University; American Museum of Natural History" },
  { id: 'l043', type: 'fact', cat: 'words', emoji: "🐭", title: "Your muscles are little mice",
    fact: "The word \"muscle\" comes from the Latin musculus, meaning \"little mouse.\"",
    more: "Ancient Romans thought a flexing muscle under the skin looked like a little mouse moving around. The Latin word for mouse, mus, is related to our own word mouse.",
    kids: true, kid: "The word muscle comes from an old word that means little mouse!", src: "Merriam-Webster" },
  { id: 'l044', type: 'quiz', cat: 'how', emoji: "🔍", q: "What is the tiny hole in an airplane window for?",
    options: ["Letting fresh air in", "Draining rainwater", "Balancing air pressure between the panes"], answer: 2,
    explain: "Plane windows have several panes. The tiny bleed hole in the middle pane evens out the pressure, so the strong outer pane carries the load and the middle pane stays ready as a backup.",
    kids: false, src: "GKN Aerospace, via Afar" },
  { id: 'l045', type: 'fact', cat: 'body', emoji: "😆", title: "You can't tickle yourself",
    fact: "You can't really tickle yourself, because your brain knows what is coming.",
    more: "Part of your brain called the cerebellum predicts how your own movements will feel and turns down the response. Researchers at University College London found that adding a short delay to a self-tickling machine made it tickle more.",
    kids: true, kid: "You can't tickle yourself because your brain knows it's coming!", src: "University College London" },
  { id: 'l046', type: 'fact', cat: 'inventions', emoji: "🧥", title: "The zipper's long road",
    fact: "The zipper took about 20 years and several inventors to get right.",
    more: "Whitcomb Judson showed a hook-and-eye clasp locker in 1893, but it often jammed or popped open. Around 1913, Gideon Sundback designed the interlocking teeth we still use. The name zipper came later, from rubber boots sold by the BFGoodrich company.",
    kids: true, kid: "The zipper took inventors about 20 years to get just right!", src: "Britannica" },
  { id: 'l047', type: 'quiz', cat: 'animals', emoji: "🦅", q: "What is the fastest animal on Earth?",
    options: ["Cheetah", "Sailfish", "Racing pigeon", "Peregrine falcon"], answer: 3,
    explain: "When diving after prey, a peregrine falcon can top 320 km/h (200 mph). The cheetah is the fastest runner on land.",
    kids: true, src: "Guinness World Records; PLoS ONE (2014)" },
  { id: 'l048', type: 'fact', cat: 'art', emoji: "🧪", title: "A new blue, by accident",
    fact: "In 2009, scientists at Oregon State University accidentally created a brand-new blue pigment.",
    more: "They were heating chemicals to make materials for electronics when one mix came out of the furnace bright blue. Named YInMn Blue after its elements, yttrium, indium and manganese, it was the first new inorganic blue pigment in about 200 years.",
    kids: true, kid: "Scientists made a brand-new blue color by accident in 2009!", src: "Oregon State University" },
  { id: 'l049', type: 'fact', cat: 'food', emoji: "🌶️", title: "Birds don't feel the burn",
    fact: "Birds can eat the hottest chili peppers without feeling any burn.",
    more: "Capsaicin, the chemical that makes chilies hot, triggers pain sensors in mammals but not in birds. That helps the plant: birds swallow the seeds whole and spread them far away, while mice, which chew up and destroy the seeds, stay away.",
    kids: true, kid: "Birds can eat super spicy peppers and not feel the heat at all!", src: "Tewksbury & Nabhan, Nature (2001)" },
  { id: 'l050', type: 'myth', cat: 'sports', emoji: "⚾", myth: "A curveball's curve is just an optical illusion.",
    truth: "It really curves, because its spin pushes air to one side. But the sudden break batters see is partly an illusion: the curve is gradual, and switching from central to side vision makes the ball seem to jump.",
    kids: false, src: "Shapiro et al., PLoS ONE (2010)" },
  { id: 'l051', type: 'fact', cat: 'space', emoji: "🪐", title: "Wide but paper thin",
    fact: "Saturn's rings stretch hundreds of thousands of kilometers across, yet in most places they are only about 10 meters thick.",
    more: "The rings are made of countless pieces of ice and rock, from dust-sized grains to chunks as big as a house. Shrunk down to the width of a football field, they would be far thinner than a sheet of paper.",
    kids: true, kid: "Saturn's rings are super wide but very thin, and they are made of lots of icy chunks!", src: "NASA" },
  { id: 'l052', type: 'fact', cat: 'ocean', emoji: "🐟", title: "Seahorse dads give birth",
    fact: "In seahorses, the dads get pregnant and give birth.",
    more: "The female places her eggs in a pouch on the male's belly, where they are fertilized and grow for about two to four weeks. Then the father pushes out the fully formed babies, sometimes hundreds at a time.",
    kids: true, kid: "Seahorse dads carry the babies in a pouch and give birth to them!", src: "National Geographic; University of Sydney research" },
  { id: 'l053', type: 'quiz', cat: 'math', emoji: "🎂", q: "How many people must be in a room for a better than 50% chance that two share a birthday?",
    options: ["23", "100", "183", "366"], answer: 0,
    explain: "Just 23, because 23 people make 253 different pairs, so a match is likelier than you might guess. With 70 people, the chance is over 99.9 percent.",
    kids: false, src: "Probability (the birthday problem)" },
  { id: 'l054', type: 'fact', cat: 'earth', emoji: "🗻", title: "Taller than Everest, sort of",
    fact: "Measured from its base on the seafloor, Hawaii's Mauna Kea is over 10,000 meters tall, taller than Mount Everest.",
    more: "Most of the mountain is hidden under the Pacific Ocean. Its peak is about 4,207 meters above sea level, so Everest, at about 8,849 meters, still has the highest summit. Mauna Kea just has a much deeper base.",
    kids: true, kid: "From the bottom of the sea, a mountain in Hawaii is taller than Mount Everest!", src: "USGS; NOAA" },
  { id: 'l055', type: 'fact', cat: 'space', emoji: "🌅", title: "16 sunrises a day",
    fact: "Astronauts on the International Space Station see about 16 sunrises and 16 sunsets every day.",
    more: "The station circles Earth about once every 90 minutes, flying at roughly 28,000 km/h. Each lap takes it through daylight and then darkness, so daytime up there lasts only about 45 minutes at a time.",
    kids: true, kid: "Astronauts in space see the Sun rise about 16 times every day!", src: "NASA" },
  { id: 'l056', type: 'myth', cat: 'body', emoji: "👅", myth: "Different parts of your tongue taste different flavors, like sweet at the tip and bitter at the back.",
    truth: "Every area of the tongue with taste buds can sense all the basic tastes. The famous tongue map came from a misread 1901 German study that found only tiny differences in sensitivity.",
    kids: true, kid: "Your whole tongue can taste sweet, salty, sour and bitter, not just one spot each!", src: "Linda Bartoshuk's research; Sensation & Perception (Oxford University Press)" },
  { id: 'l057', type: 'fact', cat: 'math', emoji: "🧮", title: "A number pyramid",
    fact: "111,111,111 × 111,111,111 = 12,345,678,987,654,321.",
    more: "The answer counts up from 1 to 9 and back down again. It works for shorter strings of ones too: 11 × 11 = 121, and 111 × 111 = 12,321. Try it on a calculator!",
    kids: true, kid: "Multiply 11 by 11 and you get 121. With more ones, the answer counts up and back down!", src: "Arithmetic (check it yourself)" },
  { id: 'l058', type: 'fact', cat: 'earth', emoji: "⛄", title: "Snowflakes love the number six",
    fact: "Snowflakes almost always have six sides or six arms.",
    more: "Water molecules lock together into a six-sided pattern when they freeze. As a snow crystal falls through clouds, tiny changes in temperature and moisture shape its arms, which is why flakes come in so many styles.",
    kids: true, kid: "Snowflakes almost always have six sides or six arms!", src: "Caltech (Kenneth Libbrecht)" },
  { id: 'l059', type: 'quiz', cat: 'inventions', emoji: "☕", q: "What did the world's first webcam keep an eye on?",
    options: ["A fish tank", "A front door", "A bird feeder", "A coffee pot"], answer: 3,
    explain: "In 1991, computer scientists at the University of Cambridge pointed a camera at their coffee pot so they could check whether it was full without walking down the hall.",
    kids: true, src: "University of Cambridge Computer Laboratory" },
  { id: 'l060', type: 'fact', cat: 'ocean', emoji: "🌟", title: "Not a fish at all",
    fact: "Starfish are not fish, and if one loses an arm, it can grow a new one.",
    more: "Scientists prefer the name sea star. They have no gills, scales or fins, and they crawl along on hundreds of tiny tube feet. Some kinds have 10, 20 or even 40 arms instead of five.",
    kids: true, kid: "Sea stars are not fish, and they can grow back a lost arm!", src: "NOAA Ocean Service" },
  { id: 'l061', type: 'fact', cat: 'sports', emoji: "⚾", title: "Less than half a second",
    fact: "A 95 mph fastball reaches home plate in about 0.4 seconds.",
    more: "The batter has only a fraction of that time to spot the pitch, decide whether to swing, and get the bat around. Much of hitting relies on quick, practiced predictions rather than slow conscious thought.",
    kids: true, kid: "A fast baseball pitch reaches the batter in less than half a second!", src: "NPR; Exploratorium" },
  { id: 'l062', type: 'quiz', cat: 'animals', emoji: "🦘", q: "What is a baby kangaroo called?",
    options: ["A joey", "A cub", "A kit", "A pup"], answer: 0,
    explain: "A joey! A newborn joey is only about 2 cm long, and it crawls into its mother's pouch to keep growing.",
    kids: true, src: "San Diego Zoo Wildlife Alliance" },
  { id: 'l063', type: 'fact', cat: 'food', emoji: "🥜", title: "Peanuts aren't nuts",
    fact: "Peanuts are not nuts. They are legumes, related to beans and peas.",
    more: "Peanut flowers bloom above ground, then their stalks bend down and push into the soil, where the pods grow. Nuts in the botanical sense, like hazelnuts and acorns, grow on trees.",
    kids: true, kid: "Peanuts are not really nuts. They grow underground and are cousins of peas!", src: "Britannica" },
  { id: 'l064', type: 'fact', cat: 'words', emoji: "😀", title: "Emoji isn't about emotion",
    fact: "The word \"emoji\" has nothing to do with \"emotion.\" It's Japanese for \"picture character.\"",
    more: "It combines the Japanese e (picture) and moji (character). The look-alike to emotion is a happy accident that may have helped the word catch on in English.",
    kids: true, kid: "Emoji is a Japanese word that means picture character!", src: "Merriam-Webster" },
  { id: 'l065', type: 'myth', cat: 'how', emoji: "🛬", myth: "Air over the top of a wing speeds up because it has to meet the air from underneath at the back edge.",
    truth: "There is no rule that the air must meet up, and air over the top actually moves faster and reaches the back first. Wings make lift by turning lots of air downward, which leaves lower pressure above the wing and higher pressure below.",
    kids: false, src: "NASA Glenn Research Center" },
  { id: 'l066', type: 'fact', cat: 'art', emoji: "🗽", title: "Lady Liberty was copper-colored",
    fact: "The Statue of Liberty was once copper-colored. It slowly turned green as the copper reacted with air and water.",
    more: "The green coating, called a patina, actually protects the metal underneath. Her copper skin is only about 2.4 mm thick, about the thickness of two pennies stacked together.",
    kids: true, kid: "The Statue of Liberty was once the color of a new penny, then it slowly turned green!", src: "National Park Service" },
  { id: 'l067', type: 'fact', cat: 'space', emoji: "📏", title: "Growing taller in space",
    fact: "Astronauts can grow up to about 3 percent taller while living in space.",
    more: "On Earth, gravity squeezes the soft discs between the bones of your spine. In orbit that squeeze goes away, so the spine stretches out. Astronauts return to their normal height within a few months of coming home.",
    kids: true, kid: "Astronauts get a little taller in space because gravity stops squishing their backs!", src: "NASA research, via Scientific American" },
  { id: 'l068', type: 'quiz', cat: 'earth', emoji: "🐧", q: "What is the largest desert on Earth?",
    options: ["The Sahara", "The Gobi", "The Arabian Desert", "Antarctica"], answer: 3,
    explain: "It's Antarctica, because a desert is any place that gets very little rain or snow, even a freezing one. Inland Antarctica gets less than 5 cm a year.",
    kids: true, src: "Britannica" },
  { id: 'l069', type: 'fact', cat: 'sports', emoji: "🤸", title: "Over the bar, under the bar",
    fact: "Top high jumpers can clear the bar while their center of mass passes underneath it.",
    more: "In the Fosbury Flop, jumpers arch backward over the bar so their body bends around it. Different parts of the body cross the bar at different moments, so the body's balance point never has to rise as high, which saves energy.",
    kids: true, kid: "High jumpers bend their bodies backward over the bar to jump higher!", src: "Scientific American" },
  { id: 'l070', type: 'fact', cat: 'how', emoji: "🥡", title: "How microwaves heat food",
    fact: "A microwave oven heats food by making its water molecules wiggle very fast.",
    more: "Microwaves flip back and forth billions of times a second, and water molecules keep twisting to line up with them. All that jostling turns into heat. Despite the popular idea, microwaves do not cook food from the inside out.",
    kids: true, kid: "Microwave ovens heat food by making the water inside it wiggle super fast!", src: "U.S. Food and Drug Administration" },
  { id: 'l071', type: 'myth', cat: 'body', emoji: "💭", myth: "People only use 10 percent of their brains.",
    truth: "Brain scans show we use virtually all of our brain over the course of a day, with different areas busier at different times. Even small injuries to almost any part of the brain can cause problems.",
    kids: true, kid: "You use all of your brain, not just a little bit of it!", src: "Scientific American" },
  { id: 'l072', type: 'fact', cat: 'ocean', emoji: "⏪", title: "The jellyfish that rewinds",
    fact: "One tiny jellyfish can turn itself back into a young stage when it is hurt or starving.",
    more: "Turritopsis dohrnii, sometimes called the immortal jellyfish, can transform back into a polyp, an early stage of its life. The polyp then grows new jellyfish. It can still be eaten or get sick, so it does not truly live forever.",
    kids: true, kid: "One kind of jellyfish can turn back into a baby when it gets hurt!", src: "American Museum of Natural History" },
  { id: 'l073', type: 'fact', cat: 'animals', emoji: "🐦", title: "Crows never forget a face",
    fact: "Crows can recognize individual human faces and remember them for years.",
    more: "University of Washington researchers wore a particular mask while catching crows to study them. For years afterward, crows scolded anyone wearing that mask, and crows that had never been caught learned to scold it too.",
    kids: true, kid: "Crows can remember your face for years!", src: "University of Washington" },
  { id: 'l074', type: 'quiz', cat: 'food', emoji: "🍌", q: "Which of these is a berry, botanically speaking?",
    options: ["Strawberry", "Raspberry", "Banana"], answer: 2,
    explain: "The banana, because to a botanist a berry grows from one flower and has its seeds inside the soft flesh. Strawberries and raspberries are not true berries.",
    kids: true, src: "Britannica" },
  { id: 'l075', type: 'fact', cat: 'words', emoji: "❓", title: "Huh? is everywhere",
    fact: "Researchers found a word like \"Huh?\" in every one of the 31 languages they studied around the world.",
    more: "Scientists at the Max Planck Institute for Psycholinguistics compared everyday conversations. Everywhere, people used a short, questioning huh-like sound to ask someone to repeat themselves, probably because it is quick and easy to say.",
    kids: true, kid: "People all over the world say a word like huh when they did not hear you!", src: "Max Planck Institute for Psycholinguistics (PLOS ONE, 2013)" },
  { id: 'l076', type: 'fact', cat: 'math', emoji: "📐", title: "Why equals looks like that",
    fact: "Welsh mathematician Robert Recorde invented the equals sign in 1557 because he was tired of writing \"is equal to.\"",
    more: "He chose two parallel lines because, as he put it, no two things can be more equal. His lines were much longer than ours, and it took many years for the sign to catch on.",
    kids: true, kid: "The equals sign is two matching lines, because nothing is more equal than that!", src: "MacTutor History of Mathematics (University of St Andrews)" },
  { id: 'l077', type: 'quiz', cat: 'art', emoji: "🎹", q: "How many keys are on a standard piano?",
    options: ["66", "76", "88", "100"], answer: 2,
    explain: "88: 52 white keys and 36 black keys, covering a little more than seven octaves.",
    kids: true, src: "Britannica" },
  { id: 'l078', type: 'fact', cat: 'how', emoji: "🛫", title: "Wings bend on purpose",
    fact: "Airliner wings are built to flex. In a test, a Boeing 787's wingtips bent upward about 7.6 meters (25 feet).",
    more: "Engineers loaded the wings with 150 percent of the strongest forces expected in service, and they held. Flexible wings also help soak up bumps from turbulence instead of passing every jolt straight into the cabin.",
    kids: true, kid: "Airplane wings can bend up and down a lot, and that is totally normal!", src: "Boeing (2010 wing test)" },
  { id: 'l079', type: 'fact', cat: 'inventions', emoji: "🛒", title: "Beep! Gum goes first",
    fact: "The first product ever scanned with a barcode at a store checkout was a pack of Wrigley's Juicy Fruit gum, in 1974.",
    more: "It happened at a Marsh Supermarket in Troy, Ohio, on June 26, 1974. Gum was a good test, because nobody was sure a barcode could be printed on something that small.",
    kids: true, kid: "The very first thing scanned with a barcode at a store was a pack of gum!", src: "Smithsonian Magazine; GS1" },
  { id: 'l080', type: 'myth', cat: 'space', emoji: "🚀", myth: "Astronauts float because there is no gravity in space.",
    truth: "At the space station's height, gravity is still about 90 percent as strong as on the ground. Astronauts float because they and the station are falling around Earth together, moving sideways so fast that they keep missing it.",
    kids: true, kid: "There is gravity in space! Astronauts float because they are falling around Earth with their spaceship.", src: "NASA" },
  { id: 'l081', type: 'fact', cat: 'ocean', emoji: "✨", title: "The open ocean glows",
    fact: "In one huge survey, about three-quarters of the animals seen in the open ocean could make their own light.",
    more: "Scientists at MBARI studied 17 years of underwater robot videos off California, from the surface down to almost 4,000 meters. Animals use their glow to find food, attract mates and hide from predators.",
    kids: true, kid: "Lots of sea animals can glow in the dark, especially deep in the ocean!", src: "MBARI (Scientific Reports, 2017)" },
  { id: 'l082', type: 'fact', cat: 'food', emoji: "🍿", title: "The science of the pop",
    fact: "Each popcorn kernel holds a tiny drop of water that turns to steam and bursts it open.",
    more: "The hard shell traps the steam until the kernel reaches about 180°C, then it splits and the starch puffs out into fluffy foam. A 2015 study found that the pop sound comes from steam escaping, not from the shell cracking.",
    kids: true, kid: "Popcorn pops because a tiny bit of water inside turns to steam and bursts the kernel!", src: "Scientific American; Journal of the Royal Society Interface (2015)" },
  { id: 'l083', type: 'quiz', cat: 'body', emoji: "🦷", q: "What is the hardest substance in the human body?",
    options: ["Bone", "Tooth enamel", "Fingernails", "Cartilage"], answer: 1,
    explain: "Tooth enamel, the shiny outer layer of your teeth. It is about 96 percent minerals, which makes it even harder than bone.",
    kids: true, src: "American Dental Association" },
  { id: 'l084', type: 'fact', cat: 'earth', emoji: "🌈", title: "Rainbows are full circles",
    fact: "Every rainbow is really a full circle. From the ground, the horizon hides the bottom part.",
    more: "Rainbows form around the point directly opposite the Sun. From an airplane, with no ground in the way, passengers can sometimes see the whole ring. Next time the Sun is behind you and there are raindrops below, look out the window!",
    kids: true, kid: "Rainbows are really circles! From an airplane you can sometimes see the whole ring.", src: "BBC Science Focus" },
  { id: 'l085', type: 'fact', cat: 'animals', emoji: "🦥", title: "Green and slow",
    fact: "Sloth fur is home to tiny green algae that can give these slow animals a greenish tint.",
    more: "Sloth hairs have cracks that soak up rainwater, making a cozy home for algae, and moths and other tiny creatures live in the fur too. Scientists think the green color may help sloths blend into the trees.",
    kids: true, kid: "Tiny green algae grow in sloth fur and can make sloths look a little green!", src: "Smithsonian; BMC Evolutionary Biology (2010)" },
  { id: 'l086', type: 'myth', cat: 'words', emoji: "📜", myth: "It's wrong to end a sentence with a preposition.",
    truth: "Grammar experts, including Merriam-Webster, say it's perfectly fine in English. The rule was popularized in the 1600s by writers who wanted English to follow Latin, where such endings don't work.",
    kids: false, src: "Merriam-Webster" },
  { id: 'l087', type: 'fact', cat: 'art', emoji: "🎼", title: "Music he could not hear",
    fact: "Beethoven was almost completely deaf when he wrote his famous Ninth Symphony.",
    more: "He had been losing his hearing for more than 20 years, but he could still imagine every note in his head. At the 1824 premiere, according to accounts, a singer turned him around so he could see the audience cheering.",
    kids: true, kid: "Beethoven wrote amazing music even after he lost his hearing!", src: "Oxford University Press" },
  { id: 'l088', type: 'fact', cat: 'inventions', emoji: "🐛", title: "A real computer bug",
    fact: "In 1947, engineers found a real moth stuck inside a computer and taped it into their logbook.",
    more: "The moth was stuck in a relay of the Harvard Mark II, and the team, which included Grace Hopper, wrote \"first actual case of bug being found.\" Engineers already called glitches bugs, but this one made the word famous, and the page is now at the Smithsonian.",
    kids: true, kid: "Long ago, a real moth got stuck inside a computer, and people called it a bug!", src: "Smithsonian National Museum of American History" },
  { id: 'l089', type: 'quiz', cat: 'sports', emoji: "🏅", q: "How long is a marathon?",
    options: ["26.2 km", "42.2 km (26.2 miles)", "50 km", "100 km"], answer: 1,
    explain: "A marathon is 42.195 km. That exact distance was the course length at the 1908 London Olympics, and it became the official standard in 1921.",
    kids: true, src: "World Athletics; Boston.com" },
  { id: 'l090', type: 'fact', cat: 'math', emoji: "📄", title: "Fold your way to the Moon",
    fact: "If you could fold a sheet of paper in half 42 times, it would be thick enough to reach the Moon.",
    more: "Each fold doubles the thickness. Starting at 0.1 mm, 42 doublings gives about 440,000 km, more than the 384,000 km to the Moon. In real life it gets hard fast: student Britney Gallivan famously managed 12 folds in 2002 using a very long strip of paper.",
    kids: true, kid: "Each fold doubles a paper's thickness. Fold it 42 times and it could reach the Moon!", src: "Arithmetic; Guinness World Records" },
  { id: 'l091', type: 'fact', cat: 'food', emoji: "🧅", title: "Why onions make you cry",
    fact: "Cutting an onion releases a gas that stings your eyes and makes them tear up.",
    more: "Slicing breaks open onion cells, mixing chemicals that are normally kept apart. An enzyme turns them into a gas called syn-propanethial-S-oxide, which drifts up and irritates your eyes, so they make tears to wash it away.",
    kids: true, kid: "Cutting onions lets out a gas that makes your eyes water!", src: "Library of Congress" },
  { id: 'l092', type: 'quiz', cat: 'ocean', emoji: "⚓", q: "The deepest known spot in the ocean is about how deep?",
    options: ["About 1 km", "About 4 km", "About 11 km"], answer: 2,
    explain: "Challenger Deep in the Mariana Trench is about 10,935 meters deep. If Mount Everest stood on the bottom, its peak would still be about 2 km underwater.",
    kids: true, src: "NOAA" },
  { id: 'l093', type: 'fact', cat: 'earth', emoji: "⭕", title: "The pilot's glory",
    fact: "From a plane, you may spot a small rainbow-colored ring around the plane's shadow on the clouds. It's called a glory.",
    more: "A glory forms when sunlight is scattered back toward the Sun by tiny cloud droplets. It always appears directly opposite the Sun, right where your own shadow falls. Look for it when the Sun is on the other side of the plane.",
    kids: true, kid: "Look for a rainbow ring around the plane's shadow on the clouds. It's called a glory!", src: "EarthSky; Atmospheric Optics" },
  { id: 'l094', type: 'fact', cat: 'inventions', emoji: "📝", title: "A glue that barely stuck",
    fact: "Post-it Notes started with a glue that seemed like a failure because it wasn't sticky enough.",
    more: "3M chemist Spencer Silver made an adhesive that held lightly and peeled off cleanly, but for years nobody knew what to do with it. His colleague Art Fry used it to keep bookmarks from falling out of his songbook, and Post-it Notes went on sale across the US in 1980.",
    kids: true, kid: "Sticky notes came from a glue that was not very sticky!", src: "Lemelson-MIT; NPR" },
  { id: 'l095', type: 'myth', cat: 'space', emoji: "🌗", myth: "The far side of the Moon is always dark.",
    truth: "The far side gets just as much sunlight as the side we see. We never see it from Earth because the Moon turns exactly once for each trip around us, keeping the same face pointed our way.",
    kids: true, kid: "The far side of the Moon gets sunshine too. We just never see it from Earth!", src: "NASA" },
  { id: 'l096', type: 'fact', cat: 'body', emoji: "🥶", title: "A leftover from fur",
    fact: "Goosebumps are a leftover from when our ancestors had thick fur.",
    more: "Each hair has a tiny muscle that pulls it upright when you are cold or scared. On a furry animal, that fluffs up the coat to trap warm air or look bigger. Our body hair is too thin for that to help much.",
    kids: true, kid: "Goosebumps happen when tiny muscles make your hairs stand up, like a furry animal fluffing up!", src: "Live Science; Harvard University research" },
  { id: 'l097', type: 'fact', cat: 'sports', emoji: "🥇", title: "Gold medals are mostly silver",
    fact: "Olympic gold medals are mostly silver.",
    more: "Under Olympic rules, a gold medal must be at least 92.5 percent silver, covered with at least 6 grams of pure gold. Bronze medals, meanwhile, are made mostly of copper.",
    kids: true, kid: "Olympic gold medals are mostly made of silver with a gold coating!", src: "International Olympic Committee" },
  { id: 'l098', type: 'quiz', cat: 'art', emoji: "🎻", q: "Before a concert, an orchestra usually tunes to a note played by which instrument?",
    options: ["Trumpet", "Piano", "Drum", "Oboe"], answer: 3,
    explain: "The oboe usually plays an A and everyone matches it. Its bright, piercing sound is easy for the whole orchestra to hear.",
    kids: true, src: "Classic FM; WQXR" },
  { id: 'l099', type: 'fact', cat: 'animals', emoji: "🌍", title: "The longest commute",
    fact: "Arctic terns fly about 70,000 km a year, migrating from the Arctic to Antarctica and back.",
    more: "Tiny trackers showed that the birds zigzag across the Atlantic to follow helpful winds, so their yearly trip averages about 70,900 km. A tern that lives 30 years could fly the distance of about three trips to the Moon and back.",
    kids: true, kid: "Arctic terns fly from the top of the world to the bottom and back every year!", src: "Egevang et al., PNAS (2010)" },
  { id: 'l100', type: 'fact', cat: 'space', emoji: "🌄", title: "Blue sunsets on Mars",
    fact: "On Mars, the sky around the setting Sun glows blue instead of orange and red.",
    more: "Fine dust in the Martian air lets blue light pass through a little more easily and scatters it close to the Sun. NASA's Curiosity rover photographed a blue Martian sunset in 2015.",
    kids: true, kid: "On Mars, the sky around the setting Sun turns blue!", src: "NASA" },
  { id: 'l101', type: 'myth', cat: 'math', emoji: "🔁", myth: "Zero point nine repeating, with nines that go on forever, is a tiny bit less than 1.",
    truth: "Zero point nine repeating is exactly equal to 1. Here's one way to see it: 1/3 is 0.333 repeating, three times that is 0.999 repeating, and three times 1/3 is exactly 1.",
    kids: false, src: "Real-number arithmetic (standard calculus texts)" },
  { id: 'l102', type: 'fact', cat: 'how', emoji: "📈", title: "Why planes fly so high",
    fact: "Airliners usually cruise around 9 to 12 kilometers (30,000 to 40,000 feet) up, where the thin air saves fuel.",
    more: "Thinner air means less drag, so the plane can go fast while burning less fuel. But wings need air for lift and engines need air to burn fuel, so pilots pick a sweet spot based on weight, winds and weather.",
    kids: true, kid: "Planes fly very high because the thin air there helps them use less fuel!", src: "Stanford University (WideScope)" },
  { id: 'l103', type: 'fact', cat: 'inventions', emoji: "🍧", title: "A kid's frozen mistake",
    fact: "The Popsicle traces back to an 11-year-old who left a cup of soda with a stirring stick outside on a cold night.",
    more: "As Frank Epperson later told the story, he found the drink frozen solid the next morning in 1905, stick and all. Years later he began selling frozen treats on sticks, and he patented them in 1924.",
    kids: true, kid: "A kid invented the Popsicle by leaving a drink with a stick outside on a cold night!", src: "NPR" },
  { id: 'l104', type: 'quiz', cat: 'words', emoji: "🛫", q: "In the spelling alphabet pilots use on the radio, which word stands for the letter A?",
    options: ["Arrow", "Atlas", "Apple", "Alfa"], answer: 3,
    explain: "Alfa, spelled with an f so speakers of many languages say it correctly. B is Bravo and C is Charlie, all the way to Z for Zulu.",
    kids: true, src: "ICAO" },
  { id: 'l105', type: 'fact', cat: 'body', emoji: "🧠", title: "An energy-hungry brain",
    fact: "Your brain is only about 2 percent of your body weight but uses about 20 percent of its energy.",
    more: "Billions of nerve cells are constantly sending signals, even while you sleep. Keeping all that chatter going makes the brain one of the hungriest organs in your body.",
    kids: true, kid: "Your brain is small, but it uses a big share of your body's energy!", src: "Raichle & Gusnard, PNAS (2002)" },
  { id: 'l106', type: 'fact', cat: 'sports', emoji: "🏃", title: "Too fast to be fair",
    fact: "In top-level sprinting, reacting to the starting gun in under 0.1 seconds counts as a false start.",
    more: "Sensors in the starting blocks measure exactly when each runner pushes off. The rule is based on research suggesting people cannot hear the gun and react faster than about a tenth of a second, so a quicker start is treated as a guess.",
    kids: true, kid: "Sprinters who start less than a tenth of a second after the gun get a false start!", src: "World Athletics rules" },
  { id: 'l107', type: 'quiz', cat: 'earth', emoji: "🔊", q: "You see lightning, then hear thunder 15 seconds later. About how far away was it?",
    options: ["About 1 km", "About 5 km", "About 15 km", "About 50 km"], answer: 1,
    explain: "Sound travels about 1 km every 3 seconds (1 mile every 5 seconds), so 15 seconds means about 5 km. The light reaches you almost instantly.",
    kids: true, src: "NOAA National Weather Service" },
  { id: 'l108', type: 'fact', cat: 'food', emoji: "🍄", title: "Mushrooms are animal cousins",
    fact: "Mushrooms are more closely related to animals than to plants.",
    more: "Mushrooms are fungi, and DNA studies show that fungi and animals share a common ancestor that is not shared with plants. Like us, fungi cannot make food from sunlight, so they must take in food from their surroundings.",
    kids: true, kid: "Mushrooms are closer cousins to animals than to plants!", src: "Baldauf & Palmer, PNAS (1993)" },
  { id: 'l109', type: 'fact', cat: 'how', emoji: "❄️", title: "Contrails are clouds",
    fact: "The white trails behind high-flying jets are thin clouds made of ice crystals.",
    more: "Jet exhaust contains water vapor and tiny particles. In air that can be colder than -40°C, the vapor quickly condenses on the particles and freezes. In dry air the trail vanishes fast, but in humid air it can spread out and last for hours.",
    kids: true, kid: "The white lines behind planes are skinny clouds made of tiny bits of ice!", src: "NASA; FAA" },
  { id: 'l110', type: 'myth', cat: 'ocean', emoji: "💧", myth: "The ocean is blue because it reflects the sky.",
    truth: "Water soaks up red light and leaves blue light behind, so a lot of water looks blue. Reflecting the sky adds only a little, and floating particles can tint the sea green or brown.",
    kids: true, kid: "The sea looks blue mostly because water soaks up red light, not because of the sky!", src: "NOAA" },
  { id: 'l111', type: 'fact', cat: 'math', emoji: "🌐", title: "Why flight paths curve",
    fact: "Long flights look curved on flat maps because the shortest path across a globe is part of a great circle.",
    more: "A great circle is any circle around the globe whose center is Earth's center, like the equator. Flat maps stretch the globe, so these shortest routes look bent, often arcing toward the poles. Stretch a string between two cities on a globe to see it.",
    kids: true, kid: "On a round Earth, the shortest way to fly looks curved on a flat map!", src: "GIS Geography; Britannica" },
  { id: 'l112', type: 'fact', cat: 'animals', emoji: "🧊", title: "Not really white",
    fact: "Polar bears have black skin, and their fur hairs are actually see-through.",
    more: "Each outer hair is clear and hollow, like a tiny straw. The hairs scatter sunlight, which makes the coat look white, a bit like how clear ice crystals make snow look white.",
    kids: true, kid: "Under its fur, a polar bear has black skin, and its hairs are see-through!", src: "San Diego Zoo Wildlife Alliance" },
  { id: 'l113', type: 'quiz', cat: 'words', emoji: "💻", q: "Which of these words can be typed using only the top row of letters on a keyboard?",
    options: ["Typewriter", "Keyboard", "Computer", "Airplane"], answer: 0,
    explain: "Typewriter! Every letter in it sits on the top row: Q W E R T Y U I O P.",
    kids: true, src: "Any QWERTY keyboard (check it yourself)" },
  { id: 'l114', type: 'fact', cat: 'art', emoji: "🎵", title: "The oldest instruments",
    fact: "The oldest known musical instruments are flutes made from bird bones and mammoth ivory roughly 40,000 years ago.",
    more: "They were found in caves in southern Germany. One nearly complete flute, carved from a vulture's wing bone, has five finger holes, which shows people were making music a very long time ago.",
    kids: true, kid: "People made flutes out of bird bones about 40,000 years ago!", src: "University of Tübingen (Nature, 2009)" },
  { id: 'l115', type: 'fact', cat: 'ocean', emoji: "🐬", title: "Dolphins have names",
    fact: "Bottlenose dolphins invent their own signature whistles and respond when they hear them, much like names.",
    more: "Each dolphin develops a unique whistle when it is young. In a study off Scotland, researchers played computer-made copies of these whistles, and wild dolphins responded mainly to their own, calling back as if answering.",
    kids: true, kid: "Dolphins have their own special whistles that work like names!", src: "University of St Andrews (PNAS, 2013)" },
  { id: 'l116', type: 'myth', cat: 'math', emoji: "🎲", myth: "If a coin lands heads five times in a row, tails is due next.",
    truth: "A fair coin has no memory, so every flip is still a 50-50 chance, no matter what happened before. Believing otherwise is called the gambler's fallacy.",
    kids: true, kid: "A coin does not remember past flips. Heads or tails is always a 50-50 chance!", src: "Britannica" },
  { id: 'l117', type: 'fact', cat: 'food', emoji: "🍅", title: "Tomato juice tastes better up here",
    fact: "Loud airplane noise can dull sweet tastes and boost savory ones, which may be why tomato juice is popular on flights.",
    more: "Cornell University researchers played recorded cabin noise at about 85 decibels while people tasted different flavors. Sweetness seemed weaker, but umami, the savory taste found in tomatoes, seemed stronger.",
    kids: true, kid: "Noisy planes can make sweet food taste less sweet and tomato juice taste better!", src: "Cornell University (2015)" },
  { id: 'l118', type: 'fact', cat: 'space', emoji: "🌀", title: "A storm bigger than Earth",
    fact: "Jupiter's Great Red Spot is a giant storm that is wider than our whole planet.",
    more: "Astronomers have watched it swirl since at least the 1800s. It has been shrinking for decades, but it is still wider than Earth.",
    kids: true, kid: "Jupiter has a giant storm called the Great Red Spot that is bigger than Earth!", src: "NASA" },
  { id: 'l119', type: 'quiz', cat: 'animals', emoji: "🦒", q: "How many bones are in a giraffe's neck?",
    options: ["3", "7", "14", "25"], answer: 1,
    explain: "Seven, the same number as in your neck! Each giraffe neck bone can be about 25 cm (10 inches) long.",
    kids: true, src: "Giraffe Conservation Foundation; Cleveland Zoological Society" },
  { id: 'l120', type: 'fact', cat: 'how', emoji: "🔥", title: "Suck, squeeze, bang, blow",
    fact: "A jet engine works in four steps that engineers sum up as suck, squeeze, bang, blow.",
    more: "A big fan sucks in air, a compressor squeezes it, and fuel is burned in it with a bang. The hot gas rushes out the back, spinning turbines that keep the fan turning. On airliners, most of the push actually comes from air the big fan blows around the engine's core.",
    kids: true, kid: "Jet engines suck in air, squeeze it, burn fuel in it, and blow it out the back!", src: "GE Aerospace; Rolls-Royce" },
  { id: 'l121', type: 'fact', cat: 'inventions', emoji: "📖", title: "Invented at age 15",
    fact: "Louis Braille invented the braille reading system when he was just 15 years old.",
    more: "Blind since early childhood, Braille was a student in Paris when he improved on a raised-dot code made by Charles Barbier. By 1824 he had a system of six-dot cells that fingers can read quickly, and it is still used around the world.",
    kids: true, kid: "Louis Braille invented a way to read with your fingers when he was 15!", src: "Perkins School for the Blind" },
  { id: 'l122', type: 'quiz', cat: 'space', emoji: "🔄", q: "Which planet spins tipped over on its side?",
    options: ["Neptune", "Saturn", "Uranus"], answer: 2,
    explain: "Uranus is tilted about 98 degrees, so it rolls around the Sun like a ball. Scientists think a huge crash with another object long ago may have knocked it over.",
    kids: true, src: "NASA" },
  { id: 'l123', type: 'fact', cat: 'earth', emoji: "🔵", title: "Why the sky is blue",
    fact: "The sky is blue because air scatters blue sunlight much more than red sunlight.",
    more: "Sunlight contains every color. Air molecules are tiny, and they bounce short blue waves of light around the sky far more than long red ones. At sunset, light passes through more air, so more blue is scattered away and reds and oranges are left.",
    kids: true, kid: "Air bounces blue light all over the sky, so the sky looks blue!", src: "NASA Space Place" },
  { id: 'l124', type: 'fact', cat: 'body', emoji: "💅", title: "Fingernails win the race",
    fact: "Fingernails grow about twice as fast as toenails.",
    more: "A study of young adults found fingernails grew about 3.5 mm a month, while toenails grew about 1.6 mm. Fingers get more blood flow and more use, which may be part of the reason.",
    kids: true, kid: "Your fingernails grow about twice as fast as your toenails!", src: "Journal of the European Academy of Dermatology and Venereology (2010)" },
  { id: 'l125', type: 'fact', cat: 'art', emoji: "🎨", title: "A painting made of dots",
    fact: "Georges Seurat spent about two years on A Sunday on La Grande Jatte, a huge painting made of countless tiny dots.",
    more: "Up close it is just dots of color, but step back and your eyes blend them into people, trees and water. The painting is about 2 by 3 meters and hangs at the Art Institute of Chicago.",
    kids: true, kid: "One famous painting is made of tiny dots that blend together when you step back!", src: "Art Institute of Chicago" },
  { id: 'l126', type: 'myth', cat: 'ocean', emoji: "🦈", myth: "Sharks have to keep swimming all the time just to breathe.",
    truth: "Only some sharks, like great whites and makos, must keep moving to push water over their gills. Others, such as nurse sharks, can rest on the seafloor and pump water over their gills with their mouths.",
    kids: true, kid: "Many sharks can rest on the sea floor and still breathe!", src: "Live Science; Florida Museum of Natural History" },
  { id: 'l127', type: 'fact', cat: 'words', emoji: "😗", title: "A language of whistles",
    fact: "On La Gomera, in Spain's Canary Islands, people can speak Spanish entirely in whistles.",
    more: "Silbo Gomero turns Spanish sounds into whistles that carry across the island's deep valleys. It is taught in schools there and is recognized by UNESCO as part of the world's cultural heritage.",
    kids: true, kid: "On one island in Spain, people can talk by whistling!", src: "UNESCO" },
  { id: 'l128', type: 'quiz', cat: 'how', emoji: "🎧", q: "How do noise-canceling headphones quiet a plane's engine hum?",
    options: ["They play an opposite sound wave", "Extra-thick padding only", "They lower the air pressure"], answer: 0,
    explain: "Tiny microphones listen to the noise, and the headphones play a mirror-image sound wave. The two cancel out, which works best on steady, low sounds like a plane's drone.",
    kids: false, src: "Sennheiser" },
  { id: 'l129', type: 'fact', cat: 'animals', emoji: "🐱", title: "Cats skip dessert",
    fact: "Cats cannot taste sweetness.",
    more: "Researchers at the Monell Chemical Senses Center found that cats have a broken copy of a gene needed to build the sweet taste receptor. As meat eaters, cats never needed to detect sugar. Tigers and cheetahs share the same gene glitch.",
    kids: true, kid: "Cats can't taste sweet things at all!", src: "Monell Chemical Senses Center (PLoS Genetics, 2005)" },
  { id: 'l130', type: 'fact', cat: 'sports', emoji: "💫", title: "Arms in, spin faster",
    fact: "Figure skaters spin faster when they pull their arms in close.",
    more: "A spinning skater keeps the same amount of spin, called angular momentum. Pulling the arms in moves their mass closer to the center, so the skater must turn faster to keep it. Stretching the arms out slows the spin down.",
    kids: true, kid: "Skaters spin faster when they pull their arms in tight!", src: "OpenStax University Physics" },
  { id: 'l131', type: 'myth', cat: 'earth', emoji: "🍂", myth: "Summer happens because Earth gets closer to the Sun.",
    truth: "Seasons come from Earth's tilt: when your half of the planet leans toward the Sun, you get more direct sunlight and longer days. Earth is actually closest to the Sun in early January, during winter in the Northern Hemisphere.",
    kids: true, kid: "Seasons happen because Earth is tilted, not because it gets closer to the Sun!", src: "NASA Space Place" },
  { id: 'l132', type: 'fact', cat: 'sports', emoji: "🏀", title: "It started with peach baskets",
    fact: "Basketball was invented in 1891 with two peach baskets hung 10 feet high.",
    more: "Gym teacher James Naismith wanted an indoor game for winter in Springfield, Massachusetts. At first the baskets still had bottoms, so someone had to fetch the ball after every score.",
    kids: true, kid: "The first basketball hoops were peach baskets!", src: "Britannica Kids; NBA" },
  { id: 'l133', type: 'fact', cat: 'body', emoji: "👆", title: "Twins, different fingerprints",
    fact: "Even identical twins have different fingerprints.",
    more: "Genes shape the overall pattern of loops and whorls, but tiny differences in the womb, like position, blood flow and growth speed, change the fine details. Fingerprints form months before birth and stay the same for life.",
    kids: true, kid: "Even identical twins have different fingerprints!", src: "Live Science; Washington State Twin Registry" },
  { id: 'l134', type: 'quiz', cat: 'math', emoji: "🏺", q: "Which number has no symbol in Roman numerals?",
    options: ["One", "Five", "One thousand", "Zero"], answer: 3,
    explain: "The Romans used I, V, X, L, C, D and M, but had no symbol for zero. Zero as a number reached Europe much later, from India by way of Arabic mathematics.",
    kids: true, src: "Britannica" },
  { id: 'l135', type: 'fact', cat: 'food', emoji: "🍍", title: "Pineapple fights gelatin",
    fact: "Fresh pineapple keeps gelatin desserts from setting.",
    more: "Pineapple contains bromelain, an enzyme that chops up proteins, including the gelatin that is supposed to form a wobbly gel. Canned pineapple works fine because heating destroys the enzyme. Kiwi and papaya have similar enzymes.",
    kids: true, kid: "Fresh pineapple stops jelly desserts from getting firm!", src: "Pearson (McMurry chemistry textbook)" },
  { id: 'l136', type: 'fact', cat: 'words', emoji: "🧳", title: "Why Chicago is ORD",
    fact: "Chicago O'Hare's airport code is ORD because the airport used to be called Orchard Field.",

    kids: true, kid: "Chicago's airport code is ORD because its old name was Orchard Field!", src: "Chicago Department of Aviation" },
  { id: 'l137', type: 'quiz', cat: 'food', emoji: "🌸", q: "Vanilla flavor comes from which kind of plant?",

    explain: "Vanilla comes from the cured seed pods of a climbing orchid that is native to Mexico and Central America.",

  { id: 'l138', type: 'fact', cat: 'art', emoji: "🐎", title: "Cave art found by teens",
    fact: "Teenagers discovered the Lascaux cave paintings in France in 1940. The art is about 17,000 years old.",
    more: "The cave walls show hundreds of animals, including horses, deer and huge wild cattle called aurochs. The cave closed to visitors in 1963 to protect the paintings, but detailed copies nearby let people see them.",
    kids: true, kid: "Kids found a cave full of animal paintings that are about 17,000 years old!", src: "EBSCO Research Starters; History UK" },
  { id: 'l139', type: 'fact', cat: 'inventions', emoji: "📦", title: "Bubble wrap wallpaper",
    fact: "Bubble wrap was first invented as a textured wallpaper.",
    more: "In 1957, engineers Alfred Fielding and Marc Chavannes sealed two pieces of plastic shower curtain together, trapping air bubbles. The wallpaper flopped, and so did selling it as greenhouse insulation, but it took off as packing material in the 1960s.",
    kids: true, kid: "Bubble wrap was first made to be wallpaper!", src: "Smithsonian Magazine" },
  { id: 'l140', type: 'myth', cat: 'body', emoji: "🔴", myth: "Blood is blue inside your body until it touches air.",
    truth: "Human blood is always red, and blood in your veins is just a darker red because it carries less oxygen. Veins look bluish because of the way light travels through skin and bounces back to your eyes.",
    kids: true, kid: "Your blood is always red! Veins only look blue because of how light shines through skin.", src: "Kienle et al., Applied Optics (1996)" },
  { id: 'l141', type: 'fact', cat: 'sports', emoji: "💪", title: "Tug of war went Olympic",
    fact: "Tug of war was an Olympic sport from 1900 to 1920.",
    more: "Teams of up to eight pullers competed, and Great Britain won the last Olympic tug of war gold in 1920. Today the sport has its own world championships.",
    kids: true, kid: "Tug of war used to be an Olympic sport!", src: "Olympedia" },
  { id: 'l142', type: 'fact', cat: 'animals', emoji: "🐝", title: "Bees dance directions",
    fact: "Honeybees tell their hivemates where to find flowers by doing a wiggly dance.",
    more: "In the waggle dance, the angle of the bee's run shows the direction of the flowers compared with the Sun, and the length of the waggle shows how far away they are. Karl von Frisch shared a Nobel Prize in 1973 for figuring this out.",
    kids: true, kid: "Honeybees do a wiggle dance to show other bees where the flowers are!", src: "Nobel Prize (Karl von Frisch, 1973)" },
  { id: 'l143', type: 'quiz', cat: 'how', emoji: "🧤", q: "Why don't most phone touchscreens work when you wear regular gloves?",
    options: ["Gloves are too soft", "The screen needs your fingerprint", "The screen senses your skin's electrical charge"], answer: 2,
    explain: "Most touchscreens sense how your finger, which conducts electricity, changes a tiny electric field on the glass. Cloth and leather block that, but touchscreen gloves have conductive threads in the fingertips.",
    kids: false, src: "SINTEF (Norwegian research institute)" },
  { id: 'l144', type: 'fact', cat: 'ocean', emoji: "🦈", title: "Hundreds of years old",
    fact: "Greenland sharks can live for at least 272 years, longer than any other known animal with a backbone.",
    more: "Scientists dated the sharks using the lenses of their eyes, which form before birth. The biggest one studied was probably around 390 years old. In the cold Arctic water, these sharks grow less than about 1 centimeter a year.",
    kids: true, kid: "Greenland sharks can live for hundreds of years!", src: "Nielsen et al., Science (2016)" },
  { id: 'l145', type: 'fact', cat: 'art', emoji: "🎹", title: "Notes are numbers",
    fact: "The note A above middle C vibrates 440 times a second, and the A one octave higher vibrates 880 times.",
    more: "Going up an octave always doubles the vibration rate. Musicians around the world tune to A = 440 Hz, an international standard, though some orchestras tune a little higher. A piano spans from about 27.5 to 4,186 vibrations per second.",
    kids: true, kid: "Every music note is a vibration, and higher notes vibrate faster!", src: "ISO 16 tuning standard" },
  { id: 'l146', type: 'fact', cat: 'words', emoji: "📚", title: "The busiest little word",
    fact: "In the Oxford English Dictionary, the verb \"run\" has 645 different meanings.",
    more: "That count came from a 2011 update, and before that \"set\" held the record. New senses keep piling up as the world changes: trains run on tracks, computers run programs, and noses run in winter.",
    kids: true, kid: "The little word run has hundreds of different meanings!", src: "Oxford English Dictionary, via NPR" },
  { id: 'l147', type: 'myth', cat: 'space', emoji: "🧱", myth: "The Great Wall of China is the only human-made thing you can see from space.",
    truth: "From orbit, the wall is very hard or impossible to spot with the naked eye, because it is narrow and blends in with the land around it. Big cities are much easier to see, especially their lights at night.",
    kids: true, kid: "The Great Wall is very hard to see from space. City lights at night are much easier to spot!", src: "NASA; Scientific American" },
  { id: 'l148', type: 'fact', cat: 'earth', emoji: "💨", title: "Riding a river of wind",
    fact: "Flights heading east often arrive early thanks to the jet stream, a river of fast wind high in the sky.",

/* ---- js/art.js ---- */
// Airplane Mode: illustrated "photos", drawn as SVG from a scene name and a seed, so the app
// needs no images and no network. AM.art(scene, seed) returns a cached data: URI.
window.AM = window.AM || {};

(function () {
  const W = 400, H = 300;

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  AM.rng = rng;
  AM.hash = function (s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };

  const f = n => Math.round(n * 10) / 10;
  const lin = (id, stops, x2 = 0, y2 = 1) =>
    `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">` +
    stops.map((c, i) => `<stop offset="${f(i / (stops.length - 1))}" stop-color="${c}"/>`).join('') + '</linearGradient>';
  const rad = (id, inner, outer) =>
    `<radialGradient id="${id}"><stop offset="0" stop-color="${inner}"/><stop offset="1" stop-color="${outer}" stop-opacity="0"/></radialGradient>`;
  const rect = (x, y, w, h, fill, extra = '') => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${fill}" ${extra}/>`;
  const circ = (x, y, r, fill, extra = '') => `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${fill}" ${extra}/>`;
  const poly = (pts, fill, extra = '') => `<polygon points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" fill="${fill}" ${extra}/>`;
  const emo = (ch, x, y, size, extra = '') =>
    `<text x="${f(x)}" y="${f(y)}" font-size="${size}" text-anchor="middle" dominant-baseline="central" ` +
    `font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" ${extra}>${ch}</text>`;

  function ridge(r, y0, amp, steps, fill) {
    const pts = [[0, H]];
    for (let i = 0; i <= steps; i++) {
      const x = (W / steps) * i;
      pts.push([x, y0 - r() * amp - (i % 2 ? amp * 0.4 : 0)]);
    }
    pts.push([W, H]);
    return poly(pts, fill);
  }

  function skyline(r, base, minH, maxH, fill, windows) {
    let out = '', x = -10;
    while (x < W) {
      const w = 22 + r() * 38, h = minH + r() * (maxH - minH);
      out += rect(x, base - h, w, h + 2, fill);
      if (windows) {
        for (let wy = base - h + 8; wy < base - 6; wy += 11) {
          for (let wx = x + 5; wx < x + w - 6; wx += 9) {
            if (r() < 0.38) out += rect(wx, wy, 4, 5, r() < 0.8 ? '#FFD98A' : '#9FD3FF', 'opacity="0.9"');
          }
        }
      }
      x += w + 2 + r() * 6;
    }
    return out;
  }

  function clouds(r, n, yMin, yMax, color, op) {
    let out = '';
    for (let i = 0; i < n; i++) {
      const cx = r() * W, cy = yMin + r() * (yMax - yMin), s = 18 + r() * 30;
      out += `<g opacity="${op}">` + circ(cx, cy, s, color) + circ(cx + s * 0.9, cy + 4, s * 0.8, color) +
        circ(cx - s * 0.9, cy + 6, s * 0.7, color) + rect(cx - s * 1.5, cy + 4, s * 3.1, s * 0.75, color, `rx="${f(s * 0.35)}"`) + '</g>';
    }
    return out;
  }

  const SKIES = [
    ['#2B2D6E', '#C8507A', '#FF9A5A', '#FFD27A'],
    ['#1D3B6F', '#7D5BA6', '#F2767A', '#FFC07A'],
    ['#3A1F5C', '#B33F6B', '#F58B54', '#FBD38D']
  ];

  const scenes = {
    sunset(r) {
      const s = SKIES[Math.floor(r() * SKIES.length)];
      const sx = 120 + r() * 160;
      let o = '<defs>' + lin('sk', s) + lin('sea', ['#2E3A6E', '#141A3A']) + rad('glow', '#FFE2A8', '#FFE2A8') + '</defs>';
      o += rect(0, 0, W, H, 'url(#sk)') + circ(sx, 190, 120, 'url(#glow)', 'opacity="0.55"') + circ(sx, 192, 34, '#FFE7B3');
      o += rect(0, 196, W, 104, 'url(#sea)');
      for (let i = 0; i < 16; i++) {
        const y = 202 + i * 6 + r() * 3, w = 20 + r() * 70 - i * 2;
        o += rect(sx - w / 2 + (r() - 0.5) * 30, y, Math.max(w, 8), 2, '#FFD9A0', `opacity="${f(0.75 - i * 0.04)}"`);
      }
      for (let i = 0; i < 3; i++) {
        const bx = 60 + r() * 280, by = 50 + r() * 70;
        o += `<path d="M${f(bx - 8)} ${f(by)} q4 -5 8 0 q4 -5 8 0" stroke="#2A1F3D" stroke-width="2" fill="none"/>`;
      }
      return o;
    },
    city(r) {
      let o = '<defs>' + lin('sk', ['#0B1030', '#1E2A5C', '#3B3F7A']) + lin('wt', ['#1A2050', '#0A0E26']) + '</defs>';
      o += rect(0, 0, W, H, 'url(#sk)');
      for (let i = 0; i < 40; i++) o += circ(r() * W, r() * 140, r() * 1.2 + 0.3, '#FFFFFF', `opacity="${f(0.3 + r() * 0.6)}"`);
      o += circ(60 + r() * 280, 50 + r() * 30, 16, '#F4F1DE', 'opacity="0.9"');
      o += skyline(r, 230, 40, 110, '#26305E', false) + skyline(r, 236, 50, 150, '#141A3C', true);
      o += rect(0, 234, W, 66, 'url(#wt)');
      for (let i = 0; i < 26; i++) o += rect(r() * W, 240 + r() * 55, 8 + r() * 26, 2, r() < 0.7 ? '#FFD98A' : '#9FD3FF', `opacity="${f(0.25 + r() * 0.4)}"`);
      return o;
    },
    mountains(r) {
      const warm = r() < 0.5;
      let o = '<defs>' + lin('sk', warm ? ['#8EC5FF', '#FFE0C2'] : ['#5D8FD6', '#CFE6FF']) + '</defs>';
      o += rect(0, 0, W, H, 'url(#sk)') + circ(80 + r() * 240, 70, 24, warm ? '#FFF1D0' : '#FFFFFF', 'opacity="0.95"');
      o += ridge(r, 150, 70, 7, '#9BB0D6') + ridge(r, 190, 70, 6, '#6E86B8') + ridge(r, 240, 50, 9, '#3F5A8A');
      o += rect(0, 268, W, 32, '#2E4A3A');
      for (let i = 0; i < 18; i++) {
        const x = r() * W, h = 20 + r() * 26;
        o += poly([[x, 272 - h], [x - 8, 274], [x + 8, 274]], '#1F3A2B');
      }
      return o;
    },
    window(r) {
      const t = r();
      const sky = t < 0.33 ? ['#3C6FC2', '#9CC8FF'] : t < 0.66 ? ['#2A2D6A', '#E57A6A', '#FFC98A'] : ['#0E1B3D', '#2C4A8A'];
      let o = '<defs>' + lin('sk', sky) + lin('fr', ['#E9ECF2', '#C9CFDA']) + '</defs>';
      o += rect(0, 0, W, H, 'url(#fr)');
